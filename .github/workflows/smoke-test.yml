# Headless boot + plenary tests — actually loads this repo's config
name: Smoke Test
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot:
    name: Nvim headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5

      - name: Link config (so nvim loads this repo)
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --version | head -1

      - name: Boot headless (fails if init.lua errors)
        run: |
          nvim --headless -c 'qa' 2>&1 | tee /tmp/boot.log
          if grep -qiE 'error|E5108|stack traceback' /tmp/boot.log; then
            echo "::error::boot produced errors"
            cat /tmp/boot.log
            exit 1
          fi
          echo "BOOT OK"

      - name: Syntax check init.lua
        run: nvim --headless -c 'luafile ~/.config/nvim/init.lua' -c 'qa' 2>&1 | tee /tmp/syntax.log

      - name: Install plugins via lazy.nvim
        run: |
          timeout 120 nvim --headless \
            -c 'lua require("lazy").sync(); vim.wait(90000, function() local s=require("lazy").stats(); return s.count and s.count > 0 end, 500)' \
            -c 'qa' 2>&1 | tee /tmp/lazy.log || true
          cat /tmp/lazy.log | tail -20

      - name: Run plenary tests
        run: |
          for f in tests/test_*.lua; do
            echo "::group:: $f"
            nvim --headless --cmd "cd $GITHUB_WORKSPACE" -c "lua require('plenary.busted').run('$f')" -c 'qa!' 2>&1 | tee /tmp/test.log
            if grep -q "Failed" /tmp/test.log; then
              echo "::error:: $f failed"
              cat /tmp/test.log
              exit 1
            fi
            echo "::endgroup::"
          done
