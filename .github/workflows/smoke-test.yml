# Headless boot + plenary tests — actually loads this repo's config
name: Smoke Test
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot:
    name: Nvim headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6

      - name: Link config (so nvim loads this repo)
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --version | head -1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install external toolchain (biome, tree-sitter CLI, ruff)
        run: |
          bun add -g @biomejs/biome@2.5.15 tree-sitter-cli@0.27.2
          uv tool install ruff==0.15.21
          echo "$HOME/.local/bin" >> "$GITHUB_PATH" # uv tool install puts ruff here
          export PATH="$HOME/.local/bin:$PATH"      # ...and in this step too
          bun --version; uv --version; biome --version; tree-sitter --version; ruff --version

      - name: Boot headless (fails if init.lua errors)
        run: |
          nvim --headless -c 'qa' 2>&1 | tee /tmp/boot.log
          if grep -qiE 'error|E5108|stack traceback' /tmp/boot.log; then
            echo "::error::boot produced errors"
            cat /tmp/boot.log
            exit 1
          fi
          echo "BOOT OK"

      - name: Syntax check init.lua
        run: nvim --headless -c 'luafile ~/.config/nvim/init.lua' -c 'qa' 2>&1 | tee /tmp/syntax.log

      - name: Install plugins via lazy.nvim
        run: |
          set -o pipefail # a failed sync must fail the job, not just print a log
          timeout 120 nvim --headless \
            -c 'lua require("lazy").sync(); vim.wait(90000, function() local s=require("lazy").stats(); return s.count and s.count > 0 end, 500)' \
            -c 'qa' 2>&1 | tee /tmp/lazy.log
          tail -20 /tmp/lazy.log

      - name: Run plenary tests
        run: |
          export PATH="$HOME/.local/share/nvim/mason/bin:$PATH"
          for f in tests/test_*.lua; do
            echo "::group:: $f"
            nvim --headless --cmd "cd $GITHUB_WORKSPACE" -c "lua require('plenary.busted').run('$f')" -c 'qa!' 2>&1 | tee /tmp/test.log
            # `| tee` swallows nvim's exit status, and plenary signals a load
            # failure with `cq` (exit 2) rather than a non-zero Failed count. A
            # file that loads but holds zero describes prints no summary and
            # exits 0. Both cases used to pass this gate, so read PIPESTATUS and
            # require a "Success:" summary to exist.
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ] || ! sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -qE 'Success:[[:space:]]+[0-9]+'; then
              echo "::error::$f failed to load or produced no results (exit $status)"
              cat /tmp/test.log
              exit 1
            fi
            # Strip ANSI; only non-zero Failed/Errors counts fail (summary always prints "Failed : 0").
            if sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -qE 'Failed *:.*[1-9]|Errors *:.*[1-9]'; then
              echo "::error:: $f failed"
              cat /tmp/test.log
              exit 1
            fi
            if sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -qE 'vim\.schedule callback:|stack traceback:|Error in command line:'; then
              echo "::error:: $f produced a runtime traceback"
              cat /tmp/test.log
              exit 1
            fi
            if sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E 'Pending:|Pending[[:space:]]+\|\|' | grep -qv '\[optional\]'; then
              echo "::error:: $f produced an unlabelled pending case"
              cat /tmp/test.log
              exit 1
            fi
            echo "::endgroup::"
          done

  stress:
    name: Full config stress test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6

      - name: Link config (so nvim loads this repo)
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --version | head -1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install external toolchain (biome, tree-sitter CLI, ruff)
        run: |
          bun add -g @biomejs/biome@2.5.15 tree-sitter-cli@0.27.2
          uv tool install ruff==0.15.21
          echo "$HOME/.local/bin" >> "$GITHUB_PATH" # uv tool install puts ruff here
          export PATH="$HOME/.local/bin:$PATH"      # ...and in this step too
          bun --version; uv --version; biome --version; tree-sitter --version; ruff --version

      - name: Install plugins via lazy.nvim
        run: |
          set -o pipefail # a failed sync must fail the job, not just print a log
          timeout 120 nvim --headless \
            -c 'lua require("lazy").sync(); vim.wait(90000, function() local s=require("lazy").stats(); return s.count and s.count > 0 end, 500)' \
            -c 'qa' 2>&1 | tail -5

      - name: Run stress harness (~4 min, exits non-zero on any FAIL)
        run: nvim --headless -c 'luafile tests/stress.lua' -c 'qa!'
